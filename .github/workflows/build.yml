name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: python scripts/make_icons.py
      - run: pytest -q tests
      - name: Build single-file Windows executable
        run: pyinstaller packaging/transcriber.spec --noconfirm --clean
        env:
          ONEFILE: "1"
      - uses: actions/upload-artifact@v4
        with:
          name: MeetingTranscriber-win64
          path: dist/MeetingTranscriber.exe
          if-no-files-found: error

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: python scripts/make_icons.py
      - run: pytest -q tests
      - run: |
          pyinstaller packaging/transcriber.spec --noconfirm --clean
          APP="dist/Meeting Transcriber.app"
          codesign --force --deep --sign - \
            --entitlements packaging/entitlements.plist "$APP"
          mkdir -p dist/dmg
          cp -R "$APP" dist/dmg/
          ln -s /Applications dist/dmg/Applications
          hdiutil create -volname "Meeting Transcriber" \
            -srcfolder dist/dmg -ov -format UDZO \
            dist/MeetingTranscriber-macOS.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: MeetingTranscriber-macOS
          path: dist/MeetingTranscriber-macOS.dmg
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos]
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/download-artifact@v4
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            MeetingTranscriber-win64/MeetingTranscriber.exe
            MeetingTranscriber-macOS/MeetingTranscriber-macOS.dmg
