[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "meeting-transcriber"
version = "1.0.0"
description = "Онлайн-транскрибация конференций (Zoom/Teams/Meet) с автостартом, треем и офлайн-моделью Whisper"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Meeting Transcriber Team" }]
keywords = ["whisper", "transcription", "zoom", "teams", "asr", "speech-to-text"]
dependencies = [
    "faster-whisper>=1.0.3,<2.0",
    "soundcard>=0.4.3",
    "numpy>=1.24",
    "psutil>=5.9",
    "pystray>=0.19",
    "pillow>=10.0",
    "pyperclip>=1.8",
]

[project.optional-dependencies]
hotkeys = ["keyboard>=0.13.5; sys_platform != 'darwin'"]
gpu = ["nvidia-cublas-cu12", "nvidia-cudnn-cu12"]
dev = ["pyinstaller>=6.3", "pytest>=7"]

[project.gui-scripts]                       # без консольного окна при pip-установке
meeting-transcriber = "transcriber.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]